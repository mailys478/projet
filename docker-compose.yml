version: '3.8'

services:
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    restart: always
    ports:
      - "11001:8080" # Port interne utilisé par Nginx pour communiquer avec Nextcloud
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config # Volume correct
      - /var/run/docker.sock:/var/run/docker.sock # Ajout du socket Docker
    environment:
      - APACHE_PORT=11001
      - APACHE_IP_BINDING=0.0.0.0 # Adapter si nécessaire
      - NEXTCLOUD_DATADIR=/mnt/data

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "443:443" # Port pour accéder à Nextcloud via Nginx
      - "80:80"   # Redirection HTTP vers HTTPS (optionnel)
    volumes:
      - /home/debian/nginx.conf:/etc/nginx/nginx.conf:ro # Configuration personnalisée de Nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro # Certificats SSL (optionnel)
    depends_on:
      - nextcloud-aio-mastercontainer

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
